<!DOCTYPE html>
<html lang="en">
<!-- SCENE s2 · PORTRAIT 1080×1920 · The news · kinetic word-reveal headline -->
<head>
<meta charset="utf-8" /><title>Scene s2 (9:16) — the news</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
  html,body{margin:0;background:#0c1020}
  #root{position:relative;width:1080px;height:1920px;overflow:hidden;color:#fff;
    background:radial-gradient(120% 70% at 50% 32%,#243155 0%,#161d36 52%,#0f1428 100%);font-family:"DM Sans",sans-serif}
  .stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:0 70px;box-sizing:border-box;text-align:center}
  .eyebrow{font-weight:600;font-size:30px;letter-spacing:.18em;text-transform:uppercase;color:#ffbaa6;opacity:0}
  .head{font-family:"Playfair Display",serif;font-weight:700;font-size:104px;line-height:1.06;letter-spacing:-.01em}
  .ln{display:block;overflow:hidden}
  .ln span{display:inline-block;transform:translateY(130px);opacity:0}
  .accent{color:#f04a25;position:relative;display:inline-block}
  .uline{position:absolute;left:0;bottom:6px;height:16px;width:100%;border-radius:8px;background:linear-gradient(100deg,#f04a25,#ffbaa6);transform-origin:left;transform:scaleX(0);box-shadow:0 8px 36px #f04a2566}
  .foot{font-size:40px;font-weight:600;color:#c2cce0;opacity:0}
</style>
</head>
<body style="margin:0">
  <div id="root" data-scene-id="s2" data-composition-id="s2" data-width="1080" data-height="1920" data-duration="3.5" data-poster-time="2.9"
       style="position:relative;width:1080px;height:1920px;overflow:hidden">
    <div class="stage">
      <div class="eyebrow" id="eyebrow">Did you know?</div>
      <div class="head">
        <span class="ln"><span>moms are getting</span></span>
        <span class="ln"><span>paid</span></span>
        <span class="ln"><span class="accent">celebrity-tier money<i class="uline" id="uline"></i></span></span>
        <span class="ln"><span>to recommend things.</span></span>
      </div>
      <div class="foot" id="foot">Not someday. Now.</div>
    </div>
  </div>
<script>
(function(){
  const root=document.getElementById('root');
  const lines=root.querySelectorAll('.ln > span');
  window.__timelines=window.__timelines||{};
  const tl=gsap.timeline({paused:true,defaults:{ease:'power4.out'}});
  tl.to('#eyebrow',{opacity:1,duration:.4},0.05)
    .to(lines,{y:0,opacity:1,duration:.7,stagger:.18},0.25)
    .to('#uline',{scaleX:1,duration:.6,ease:'power4.out'},1.35)
    .to('#foot',{opacity:1,duration:.5},2.0);
  window.__timelines["s2"]=tl;
  if(!window.__HYPERFRAMES__){const p=parseFloat(root.dataset.posterTime);tl.seek(p);
    gsap.delayedCall(1.4,()=>{const loop=()=>tl.play(0);tl.eventCallback('onComplete',()=>gsap.delayedCall(.7,loop));loop();});}
})();
</script>
</body>
</html>
